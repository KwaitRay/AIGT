$("#load-metrics").innerHTML='<div class="numbers"><div class="number"><small>最大 / 平均</small><strong>'+f(peak/mean,2)+'</strong></div><div class="number"><small>变异系数</small><strong>'+f(cv)+'</strong></div><div class="number"><small>归一化熵</small><strong>'+f(entropy)+'</strong></div></div><p class="note" id="allocation-total">分配总计 '+counts.reduce((a,b)=>a+b,0)+'；平均256；最忙专家'+peak+'。没有模拟丢弃或容量填充。</p>';}

['次序','比较组','主要决策','停止或回退条件'],
['1 证据链','原查询／规范化／解析修复／融合与重排','先解决资料不可见和时间错配','召回提高但必要证据丢失或尾时延失控'],
['2 监督数据','原数据／质量修订／配比调整','固定预算分开测质量与分布变化','数学逻辑回归超出预设容忍范围'],
['3 偏好训练','原SFT／优选继续SFT／DPO','相对偏好是否提供额外收益','仅评审风格分提高，任务无收益'],
['4 蒸馏接线','几百个上下文起步','词表、前缀、掩码、冻结与版本正确','无有效梯度或采样版本落后'],
['5 蒸馏选型','建议约5000上下文；离线／前向／反向／混合','独立质量与服务预算共同选择','教师失误或长尾能力退化'],
['6 条件扩量','候选约15000～30000上下文','补覆盖缺口，记录有效词元与成本','新增数据同质化、学习曲线停滞'],
['7 上线验证','原服务／候选服务；量化另做对照','正确率、完整显示P95、成功成本','超时、关键错误或能力回退']
]]);
function deepPanels(page){return (depth[page]||[]).map(d=>sec(d[0],d[1],'<div class="panel">'+table(d[2][0],d[2].slice(1))+'</div>')).join('');}
function latencyLab(){return sec('时延拆解：首输出不一定是首个可见答案','串行预算演示；不代表实测性能','<div class="grid2"><div class="panel">'+range('prep','检索与记忆关键路径／毫秒',0,1500,10,180)+range('queue','模型排队／毫秒',0,1500,10,40)+range('prefill','预填充与首次采样／毫秒',0,1500,10,160)+range('network','传输合计／毫秒',0,500,10,50)+range('tpot','后续每词元／毫秒',1,100,1,20)+range('thinking','不展示的前置思考词元',0,300,1,0)+range('tokens','可见答案词元数',1,200,1,100)+range('display','显示缓冲／毫秒',0,500,10,0)+'<label>展示方式 <select id="display-mode" class="btn"><option value="stream">逐步显示</option><option value="complete">完整后显示</option></select></label></div><div class="panel"><div id="latency-result" aria-live="polite"></div><div class="formula">服务首输出预算 = 排队＋预填充<br>答案首显 ≈ 前置＋排队＋预填充＋传输＋H×单步＋缓冲<br>完整显示 ≈ 答案首显＋(N−1)×单步</div><p class="note">H为前置隐藏词元数，N为可见答案词元数，假设恒定解码步时长、单次生成、无推测解码。完整后显示模式下，用户首显等于完整显示。80词不是80词元。</p><details open><summary>如何看待毫秒量级</summary><p>8B／单H100／BF16／输入约1000～2000词元／低并发／无缓存命中时，可把预填充50～300毫秒、后续8～30毫秒每词元作为初步预算假设。不是实测基准，也不能套用到235B混合专家模型。</p></details><p class="note">并行检索按关键路径计时；客户端块间隔不等于GPU计算；各阶段95百分位不能直接相加。</p></div></div>')+sec('慢在哪里，就在哪里做对照','固定模型、硬件、精度和请求分布','<div class="panel">'+table(['现象','先查什么','实验'],[['首字变慢、队列变长','负载是否接近服务容量','扫到达速率，观察失败率和尾延迟'],['长输入首字慢','输入长度、缓存命中与分块预算','按512／2048／8192分桶，缓存命中单列'],['生成中出现停顿','混合请求调度、通信和长上下文','同时比较首字与输出间隔'],['小模型完整回答更快','输出是否变短、精度是否改变','分别固定长度和按真实回答测量'],['吞吐提高但用户更慢','批量增长和排队','看满足质量及时延门槛的有效吞吐']])+'<p class="note">服务侧记录排队、预填充、解码及首输出；应用侧单独记录检索、首个答案和镜片显示。<a href="https://docs.vllm.ai/en/latest/usage/metrics/">vLLM 指标文档 ↗</a></p></div>');}
function latency(){const v={};['prep','queue','prefill','network','tpot','thinking','tokens','display'].forEach(id=>{v[id]=+$('#'+id).value;$('#'+id+'-value').textContent=v[id];});const service=v.queue+v.prefill,first=v.prep+service+v.network+v.thinking*v.tpot+v.display,total=first+(v.tokens-1)*v.tpot,visible=$('#display-mode').value==='complete'?total:first;$('#latency-result').innerHTML='<div class="numbers" style="grid-template-columns:1fr 1fr"><div class="number"><small>服务首输出预算</small><strong>'+service+' ms</strong></div><div class="number"><small>用户首个有效显示</small><strong id="ttft">'+visible+' ms</strong></div><div class="number"><small>完整回答显示</small><strong id="full-time">'+total+' ms</strong></div><div class="number"><small>单请求解码速度</small><strong>'+f(1000/v.tpot,1)+'</strong><small>词元／秒，不是系统总吞吐</small></div></div><p>隐藏思考额外等待：'+v.thinking*v.tpot+'毫秒；后续可见答案：'+(v.tokens-1)*v.tpot+'毫秒。</p>';};
Object.keys(renderers).forEach(page=>{const original=renderers[page];renderers[page]=()=>{let out=original();if(page==='overview')out=out.replace('<section class="section">',journey()+'<section class="section">');if(page==='opd'){out=out.replace('80元八折后64元，再满60减10得54元。验收金额、门槛与短答案，不仅看输出长度。','四轮更正后：64元不满足70元门槛，加6元运费共70元；重点检查是否沿用旧54元。');}return out+deepPanels(page);};});
const baseInit=init;
init=function(page){baseInit(page);if(page==='overview'){journeyKey='weather';journeyRound=0;wireTabs('journey-tabs',key=>{journeyKey=key;journeyRound=0;renderJourney();});renderJourney();}if(page==='opd'){['queue','network','thinking','display'].forEach(id=>$('#'+id).oninput=latency);$('#display-mode').onchange=latency;}};

window.addEventListener("hashchange",navigate);navigate();
